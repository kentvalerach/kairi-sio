# KAIRI-SIO — Confederación Hidrográfica del Ebro (CHE)
# Sprint: Experimento Intercuencas 2026-03-13
# Bounds nivel: percentiles empíricos serie SAIH Ebro 2025-2026 (n≈35,000/embalse)
# Pendiente: validar con Catálogo Nacional de Presas CHE

confederation:
  code: CHE
  name: Confederación Hidrográfica del Ebro
  status: pilot

# ── Scoring weights (AHP — Saaty 1980, CR<0.10) ──────────────────────────────
# Idénticos a CHG — principio de universalidad: jerarquía física no depende de cuenca
weights:
  w_f: 0.40
  w_l: 0.30
  w_t: 0.20
  w_h: 0.10

# ── Decision thresholds (GUM JCGM 100:2008) ──────────────────────────────────
thresholds:
  certificada: 0.85
  degradada:   0.50

# ── Latency (S_t) ─────────────────────────────────────────────────────────────
# Intervalo nominal SAIH Ebro: 900s (mismo protocolo que CHG)
latency:
  breakpoints_s: [60, 300, 900]
  scores:        [1.0, 0.7, 0.4, 0.1]
  critical_s:    900

# ── Gap thresholds (WMO-No.168) ───────────────────────────────────────────────
gaps:
  warn: 0.10
  fail: 0.30

# ── Flatline (Nelson 1984 · ISO 7870-2:2013 · WMO-No.168) ────────────────────
flatline:
  k_hours:        8
  critical_hours: 48

# ── Drift (Page 1954 · Lucas & Saccucci 1990) ────────────────────────────────
drift:
  threshold: 3.0

# ── Spike detection ───────────────────────────────────────────────────────────
spike:
  h_level_m_per_h: 1.0   # PROVISIONAL — pendiente calibración CHE

# ── Physical bounds H_level por embalse ──────────────────────────────────────
# H_min/H_max: min_obs ±3m margen | Pendiente fichas técnicas CHE
embalses:
  ITOIZ:
    # Serie: min=558.59 / max=588.07 msnm  (n=34,820)
    H_min: 555.0
    H_max: 590.0
    Q_min: 0.0
    Q_max: 5000.0
    P_min: 0.0
    P_max: 300.0

  MEQUINENZA:
    # Serie: min=105.79 / max=120.97 msnm  (n=35,099)
    H_min: 102.0
    H_max: 122.0
    Q_min: 0.0
    Q_max: 5000.0
    P_min: 0.0
    P_max: 300.0

  YESA:
    # Nivel: min=458.17 / max=487.77 msnm  (n=35,098)
    # Caudal: min=0.24  / max=48.26 m3/s   (n=35,097, NaN=46)
    H_min: 455.0
    H_max: 490.0
    Q_min: 0.0
    Q_max: 500.0
    P_min: 0.0
    P_max: 300.0